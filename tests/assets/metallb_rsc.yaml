apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ip-adrs-pool
spec:
  addresses:
  - 192.168.122.192/32
  avoidBuggyIPs: true
  serviceAllocation:
    namespaces:
    - default
    serviceSelectors:
    - matchExpressions:
      - {key: "serviceType", operator: In, values: [kubernetes-vip]}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advert
spec:
  ipAddressPools:
  - ip-adrs-pool
